openapi: 3.1.1
info:
  title: Pactline Work API
  version: 1.0.0
  description: Versioned work-management API for authenticated people and agents.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /api/v1/me:
    get:
      operationId: getCurrentPrincipal
      summary: Get the authenticated principal
      responses:
        "200":
          $ref: "#/components/responses/CurrentPrincipal"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List users available for work assignment
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/UserList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: List tasks
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TaskStatus"
        - name: priority
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TaskPriority"
        - name: execution_mode
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TaskExecutionMode"
        - name: assignee
          in: query
          description: User UUID or `none`.
          schema:
            type: string
        - name: label
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: project_number
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: milestone_id
          in: query
          schema:
            type: string
            format: uuid
        - name: creator_id
          in: query
          schema:
            type: string
            format: uuid
        - name: backlog_only
          in: query
          description: Return only tasks in a Project backlog.
          schema:
            type: boolean
            default: false
        - name: archived
          in: query
          schema:
            type: string
            enum: [exclude, only, all]
            default: exclude
        - name: sort
          in: query
          schema:
            type: string
            enum: [number, created_at, updated_at, due_date, priority]
            default: updated_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          $ref: "#/components/responses/TaskList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTask
      summary: Create a task
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          $ref: "#/components/responses/TaskCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: getTask
      summary: Get a task
      responses:
        "200":
          $ref: "#/components/responses/Task"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateTask
      summary: Update a task
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          $ref: "#/components/responses/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/archive:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    post:
      operationId: archiveTask
      summary: Archive a task
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/restore:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    post:
      operationId: restoreTask
      summary: Restore a task
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/comments:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: listTaskComments
      summary: List task comments
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/CommentList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTaskComment
      summary: Add a task comment
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateWrite"
      responses:
        "201":
          $ref: "#/components/responses/CommentCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    patch:
      operationId: updateTaskComment
      summary: Update a task comment
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentUpdateWrite"
      responses:
        "200":
          $ref: "#/components/responses/Comment"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTaskComment
      summary: Delete a task comment
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/attachments:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: listTaskAttachments
      summary: List active Task attachments
      responses:
        "200":
          $ref: "#/components/responses/TaskAttachmentList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/attachments/uploads:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    post:
      operationId: createTaskAttachmentUpload
      summary: Create a private attachment upload session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskAttachmentUploadWrite"
      responses:
        "201":
          $ref: "#/components/responses/TaskAttachmentUploadCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/attachments/uploads/{id}/content:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    put:
      operationId: uploadTaskAttachmentContent
      summary: Stream content into a Local storage upload session
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/attachments/uploads/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: completeTaskAttachmentUpload
      summary: Verify an uploaded object and create the Task attachment
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          $ref: "#/components/responses/TaskAttachmentCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/attachments/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    delete:
      operationId: deleteTaskAttachment
      summary: Soft-delete a Task attachment
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/attachments/{id}/content:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getTaskAttachmentContent
      summary: Read authorized private attachment content
      parameters:
        - name: disposition
          in: query
          schema:
            type: string
            enum: [inline, attachment]
            default: inline
      responses:
        "200":
          description: Attachment content
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/activity:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: listTaskActivity
      summary: List task activity
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TaskActivityList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/agent-conversations:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: listTaskAgentConversations
      summary: List Agent conversations for the task timeline
      responses:
        "200":
          $ref: "#/components/responses/TaskClaimConversationList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/agent/claims/current:
    get:
      operationId: getCurrentTaskClaim
      summary: Get the unfinished Claim owned by this client session
      parameters:
        - $ref: "#/components/parameters/ClientKind"
        - $ref: "#/components/parameters/ClientSessionID"
      responses:
        "200":
          $ref: "#/components/responses/TaskClaim"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/claim:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    post:
      operationId: claimTask
      summary: Claim an eligible assigned task for this client session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskClaimSession"
      responses:
        "201":
          $ref: "#/components/responses/TaskClaimCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/claims/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getTaskClaim
      summary: Get a Claim
      responses:
        "200":
          $ref: "#/components/responses/TaskClaim"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/claims/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: listTaskClaimMessages
      summary: List the immutable Agent conversation for a Claim
      responses:
        "200":
          $ref: "#/components/responses/TaskClaimMessageList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/claims/{id}/extend:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: extendTaskClaim
      summary: Extend an active Claim
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskClaimSession"
      responses:
        "200":
          $ref: "#/components/responses/TaskClaim"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/claims/{id}/progress:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: addTaskClaimProgress
      summary: Add an Agent progress message
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskClaimAgentMessage"
      responses:
        "201":
          $ref: "#/components/responses/TaskClaimMessageCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/claims/{id}/ask:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: askTaskClaimQuestion
      summary: Ask a human question and pause the Claim
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskClaimAgentMessage"
      responses:
        "200":
          $ref: "#/components/responses/TaskClaimAction"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/claims/{id}/answer:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: answerTaskClaimQuestion
      summary: Answer the pending Agent question and resume the Claim
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskClaimHumanAnswer"
      responses:
        "200":
          $ref: "#/components/responses/TaskClaimAction"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/claims/{id}/release:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: releaseTaskClaim
      summary: Release a Claim
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskClaimRelease"
      responses:
        "200":
          $ref: "#/components/responses/TaskClaim"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/claims/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: submitTaskClaim
      summary: Submit verified Agent work for human review
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskClaimAgentMessage"
      responses:
        "200":
          $ref: "#/components/responses/TaskClaimAction"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/claims/{id}/criteria/{criterion_id}/checks:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
      - $ref: "#/components/parameters/ClaimCriterionID"
    post:
      operationId: recordTaskClaimAcceptanceCheck
      summary: Record an acceptance check owned by the active Claim
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskClaimAcceptanceCheckCreate"
      responses:
        "201":
          $ref: "#/components/responses/AcceptanceCheckCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/labels:
    get:
      operationId: listLabels
      summary: List labels
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/LabelList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createLabel
      summary: Create a label
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelWrite"
      responses:
        "201":
          $ref: "#/components/responses/LabelCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/labels/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      operationId: updateLabel
      summary: Rename a label
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelWrite"
      responses:
        "200":
          $ref: "#/components/responses/Label"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteLabel
      summary: Delete a label
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: archived
          in: query
          schema:
            type: string
            enum: [exclude, all]
            default: exclude
      responses:
        "200":
          $ref: "#/components/responses/ProjectList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProject
      summary: Create a project
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          $ref: "#/components/responses/ProjectCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
    get:
      operationId: getProject
      summary: Get a project and its work aggregate
      responses:
        "200":
          $ref: "#/components/responses/ProjectDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateProject
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
      responses:
        "200":
          $ref: "#/components/responses/Project"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/archive:
    $ref: "#/components/pathItems/ProjectArchive"
  /api/v1/projects/{number}/restore:
    $ref: "#/components/pathItems/ProjectRestore"
  /api/v1/projects/{number}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
    get:
      operationId: listProjectMembers
      summary: List Project members
      responses:
        "200":
          $ref: "#/components/responses/ProjectMembershipList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addProjectMember
      summary: Add a Project member
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMembershipCreate"
      responses:
        "201":
          $ref: "#/components/responses/ProjectMembershipChanged"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateProjectMember
      summary: Change a Project member role
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMembershipPatch"
      responses:
        "200":
          $ref: "#/components/responses/ProjectMembershipChanged"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeProjectMember
      summary: Remove a Project member
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/ProjectMembershipMutation"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/milestones:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
    post:
      operationId: createMilestone
      summary: Create a milestone
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneCreate"
      responses:
        "201":
          $ref: "#/components/responses/MilestoneCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/milestones/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
      - $ref: "#/components/parameters/ResourceID"
    patch:
      operationId: updateMilestone
      summary: Update a milestone
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/ProjectIfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestonePatch"
      responses:
        "200":
          $ref: "#/components/responses/Milestone"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/milestones/{id}/complete:
    $ref: "#/components/pathItems/MilestoneComplete"
  /api/v1/projects/{number}/milestones/{id}/activate:
    $ref: "#/components/pathItems/MilestoneActivate"
  /api/v1/projects/{number}/milestones/{id}/cancel:
    $ref: "#/components/pathItems/MilestoneCancel"
  /api/v1/projects/{number}/milestones/{id}/reopen:
    $ref: "#/components/pathItems/MilestoneReopen"
  /api/v1/tasks/{number}/criteria:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: listTaskCriteria
      summary: List task acceptance criteria
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/CriterionList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTaskCriterion
      summary: Create a task acceptance criterion
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriterionCreate"
      responses:
        "201":
          $ref: "#/components/responses/CriterionCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/milestones/{id}/criteria:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
      - $ref: "#/components/parameters/ResourceID"
    get:
