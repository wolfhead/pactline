          type: boolean
    UserRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
    CurrentPrincipal:
      type: object
      additionalProperties: false
      required: [actor, subject, authentication_method, scopes, impersonating]
      properties:
        actor:
          $ref: "#/components/schemas/User"
        subject:
          $ref: "#/components/schemas/User"
        authentication_method:
          type: string
          enum: [session, api_token, agent_delegate]
        scopes:
          type: array
          items:
            type: string
            enum: ["work:read", "work:execute", "work:write"]
        impersonating:
          type: boolean
    UserList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"
    Page:
      type: object
      additionalProperties: false
      properties:
        next_cursor:
          type: string
    TaskStatus:
      type: string
      enum: [todo, in_progress, in_review, done, cancelled]
    TaskPriority:
      type: string
      enum: [none, low, medium, high, urgent]
    TaskExecutionMode:
      type: string
      enum: [human_only, agent_allowed]
    MilestoneStatus:
      type: string
      enum: [planned, active, completed, cancelled]
    AcceptanceOutcome:
      type: string
      enum: [passed, failed, unable, waived]
    NullableUUID:
      oneOf:
        - type: string
          format: uuid
        - type: "null"
    NullableDate:
      oneOf:
        - type: string
          format: date
        - type: "null"
    NullableTaskNumber:
      oneOf:
        - type: integer
          format: int64
          minimum: 1
        - type: "null"
    TaskCreate:
      type: object
      additionalProperties: false
      required: [title, context, expected_result, project_number]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        context:
          type: string
          minLength: 1
          description: Why the task is needed or what current problem it addresses.
        expected_result:
          type: string
          minLength: 1
          description: The observable result expected when the task is complete.
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        execution_mode:
          $ref: "#/components/schemas/TaskExecutionMode"
        assignee_id:
          $ref: "#/components/schemas/NullableUUID"
        start_date:
          $ref: "#/components/schemas/NullableDate"
          description: Optional first scheduled day. Must not be after due_date.
        due_date:
          $ref: "#/components/schemas/NullableDate"
        label_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        project_number:
          type: integer
          format: int64
          minimum: 1
        milestone_id:
          $ref: "#/components/schemas/NullableUUID"
        parent_number:
          type: integer
          format: int64
          minimum: 1
          description: Optional parent task in the same Project and Milestone (or the same Backlog). Only one parent-child level is supported.
        dependency_numbers:
          type: array
          uniqueItems: true
          description: Tasks in the same Project that must conclude before this task can enter done.
          items:
            type: integer
            format: int64
            minimum: 1
    TaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        context:
          type: string
          minLength: 1
        expected_result:
          type: string
          minLength: 1
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        execution_mode:
          $ref: "#/components/schemas/TaskExecutionMode"
        assignee_id:
          $ref: "#/components/schemas/NullableUUID"
        start_date:
          $ref: "#/components/schemas/NullableDate"
          description: Set or clear the first scheduled day. Must not be after due_date.
        due_date:
          $ref: "#/components/schemas/NullableDate"
        label_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        project_number:
          type: integer
          format: int64
          minimum: 1
        milestone_id:
          $ref: "#/components/schemas/NullableUUID"
        parent_number:
          $ref: "#/components/schemas/NullableTaskNumber"
          description: Set or clear the one-level parent relationship. Moving a child to another Project or Milestone requires clearing this field in the same request.
        dependency_numbers:
          type: array
          uniqueItems: true
          description: Replace all predecessor dependencies. Dependencies must stay within the Project and may not form a cycle.
          items:
            type: integer
            format: int64
            minimum: 1
        schedule_shift_days:
          type: integer
          minimum: -3650
          maximum: 3650
          description: Shift this task's schedule by whole days. For a parent task, every scheduled child is shifted atomically.
    ProjectRef:
      type: object
      additionalProperties: false
