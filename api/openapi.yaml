        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
          minimum: 1
        version:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
        context:
          type: string
        expected_result:
          type: string
        description:
          type: string
        phase:
          $ref: "#/components/schemas/TaskPhase"
        activity:
          $ref: "#/components/schemas/TaskActivityState"
        review_cycle:
          type: integer
          format: int64
          minimum: 0
        active_issue_thread_id:
          type: string
          format: uuid
        main_thread_id:
          type: string
          format: uuid
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assignee:
          $ref: "#/components/schemas/UserRef"
        creator:
          $ref: "#/components/schemas/UserRef"
        start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        project:
          $ref: "#/components/schemas/ProjectRef"
        milestone:
          $ref: "#/components/schemas/MilestoneRef"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        parent:
          $ref: "#/components/schemas/TaskRelationRef"
        children:
          type: array
          items:
            $ref: "#/components/schemas/TaskRelationRef"
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/TaskRelationRef"
        dependents:
          type: array
          items:
            $ref: "#/components/schemas/TaskRelationRef"
        blocked:
          type: boolean
          description: True when at least one dependency is not done or cancelled. Blocked tasks may start but may not enter done.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
    TaskList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Task"
    ActorType:
      type: string
      enum: [user, agent, system]
