openapi: 3.1.1
info:
  title: Pactline Work API
  version: 1.0.0
  description: Versioned work-management API for authenticated people and agents.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /api/v1/me:
    get:
      operationId: getCurrentPrincipal
      summary: Get the authenticated principal
      responses:
        "200":
          $ref: "#/components/responses/CurrentPrincipal"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/claims/current:
    get:
      operationId: getCurrentTaskStageClaim
      summary: Get the active Claim owned by this authenticated client session
      parameters:
        - $ref: "#/components/parameters/ClientKind"
        - $ref: "#/components/parameters/ClientSessionID"
      responses:
        "200":
          $ref: "#/components/responses/TaskStageClaim"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List users available for work assignment
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/UserList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: List tasks
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: phase
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TaskPhase"
        - name: activity
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TaskActivityState"
        - name: priority
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TaskPriority"
        - name: assignee
          in: query
          description: User UUID or `none`.
          schema:
            type: string
        - name: label
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: project_number
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: milestone_id
          in: query
          schema:
            type: string
            format: uuid
        - name: creator_id
          in: query
          schema:
            type: string
            format: uuid
        - name: backlog_only
          in: query
          description: Return only tasks in a Project backlog.
          schema:
            type: boolean
            default: false
        - name: archived
          in: query
          schema:
            type: string
            enum: [exclude, only, all]
            default: exclude
        - name: sort
          in: query
          schema:
            type: string
            enum: [number, created_at, updated_at, due_date, priority]
            default: updated_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          $ref: "#/components/responses/TaskList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTask
      summary: Create a task
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          $ref: "#/components/responses/TaskCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: getTask
      summary: Get a task
      responses:
        "200":
          $ref: "#/components/responses/Task"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateTask
      summary: Update a task
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          $ref: "#/components/responses/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/archive:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    post:
      operationId: archiveTask
      summary: Archive a task
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/restore:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    post:
      operationId: restoreTask
      summary: Restore a task
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/commands/mark-ready:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    post:
      operationId: markTaskReady
      summary: Mark a backlog Task ready to claim
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/TaskWorkflow"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/commands/withdraw-readiness:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    post:
      operationId: withdrawTaskReadiness
      summary: Return a ready Task to backlog
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonWrite"
      responses:
        "200":
          $ref: "#/components/responses/TaskWorkflow"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/claims:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: listTaskStageClaims
      summary: List execution and acceptance Claims for a Task
      responses:
        "200":
          $ref: "#/components/responses/TaskStageClaimList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTaskStageClaim
      summary: Claim the Task's currently available execution or review stage
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskStageClaimCreate"
      responses:
        "201":
          $ref: "#/components/responses/TaskStageClaimCommand"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/claims/{id}/release:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: releaseTaskStageClaim
      summary: Release the active Claim with a durable handoff
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskStageClaimFinish"
      responses:
        "200":
          $ref: "#/components/responses/TaskStageClaimCommand"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/claims/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: submitTaskWork
      summary: Submit execution work for Task acceptance review
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskStageClaimFinish"
      responses:
        "200":
          $ref: "#/components/responses/TaskStageClaimCommand"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/claims/{id}/request-resolution:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: requestTaskResolution
      summary: End the Claim and open one typed blocking Issue Thread
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskResolutionRequest"
      responses:
        "200":
          $ref: "#/components/responses/TaskResolutionRequested"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/claims/{id}/request-changes:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: requestTaskChanges
      summary: Return acceptance review to execution
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskStageClaimFinish"
      responses:
        "200":
          $ref: "#/components/responses/TaskStageClaimCommand"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/claims/{id}/accept:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: acceptTask
      summary: Accept the Task outcome and complete the Task
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskStageClaimFinish"
      responses:
        "200":
          $ref: "#/components/responses/TaskStageClaimCommand"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/claims/{id}/criteria/{criterion_id}/checks:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
      - $ref: "#/components/parameters/ClaimCriterionID"
    post:
      operationId: recordTaskStageAcceptanceCheck
      summary: Record execution verification or acceptance through the active Claim
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskStageAcceptanceCheckWrite"
      responses:
        "201":
          $ref: "#/components/responses/AcceptanceCheckCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/issues/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: resolveTaskIssue
      summary: Resolve the active Issue and return the Task to available
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskIssueResolve"
      responses:
        "200":
          $ref: "#/components/responses/TaskIssueResolved"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/commands/cancel:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    post:
      operationId: cancelTask
      summary: Cancel a non-terminal Task and close active workflow state
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonWrite"
      responses:
        "200":
          $ref: "#/components/responses/TaskCancelResult"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/threads:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: listTaskThreads
      summary: List the Main Thread and historical Issue Threads
      responses:
        "200":
          $ref: "#/components/responses/TaskThreadList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/threads/{id}/items:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: listTaskThreadItems
      summary: List Items in one Task Thread
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TaskThreadItemList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTaskThreadMessage
      summary: Add an ordinary message or immutable progress update to one Task Thread
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskThreadMessageWrite"
      responses:
        "201":
          $ref: "#/components/responses/TaskThreadItem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/thread-items/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      operationId: updateTaskThreadMessage
      summary: Edit a message owned by the caller
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskThreadMessageUpdate"
      responses:
        "200":
          $ref: "#/components/responses/TaskThreadItem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTaskThreadMessage
      summary: Delete a message owned by the caller
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/TaskThreadItem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/attachments:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: listTaskAttachments
      summary: List active Task attachments
      responses:
        "200":
          $ref: "#/components/responses/TaskAttachmentList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/attachments/uploads:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    post:
      operationId: createTaskAttachmentUpload
      summary: Create a private attachment upload session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskAttachmentUploadWrite"
      responses:
        "201":
          $ref: "#/components/responses/TaskAttachmentUploadCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/attachments/uploads/{id}/content:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    put:
      operationId: uploadTaskAttachmentContent
      summary: Stream content into a Local storage upload session
      parameters:
        - $ref: "#/components/parameters/ContentLength"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/attachments/uploads/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: completeTaskAttachmentUpload
      summary: Verify an uploaded object and create the Task attachment
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          $ref: "#/components/responses/TaskAttachmentCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/attachments/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    delete:
      operationId: deleteTaskAttachment
      summary: Soft-delete a Task attachment
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/attachments/{id}/content:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getTaskAttachmentContent
      summary: Read authorized private attachment content
      parameters:
        - name: disposition
          in: query
          schema:
            type: string
            enum: [inline, attachment]
            default: inline
      responses:
        "200":
          description: Attachment content
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/activity:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: listTaskActivity
      summary: List task activity
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TaskActivityList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/labels:
    get:
      operationId: listLabels
      summary: List labels
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/LabelList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createLabel
      summary: Create a label
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelWrite"
      responses:
        "201":
          $ref: "#/components/responses/LabelCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/labels/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      operationId: updateLabel
      summary: Rename a label
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelWrite"
      responses:
        "200":
          $ref: "#/components/responses/Label"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteLabel
      summary: Delete a label
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: archived
          in: query
          schema:
            type: string
            enum: [exclude, all]
            default: exclude
      responses:
        "200":
          $ref: "#/components/responses/ProjectList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProject
      summary: Create a project
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          $ref: "#/components/responses/ProjectCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
    get:
      operationId: getProject
      summary: Get a project and its work aggregate
      responses:
        "200":
          $ref: "#/components/responses/ProjectDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateProject
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
      responses:
        "200":
          $ref: "#/components/responses/Project"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/archive:
    $ref: "#/components/pathItems/ProjectArchive"
  /api/v1/projects/{number}/restore:
    $ref: "#/components/pathItems/ProjectRestore"
  /api/v1/projects/{number}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
    get:
      operationId: listProjectMembers
      summary: List Project members
      responses:
        "200":
          $ref: "#/components/responses/ProjectMembershipList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addProjectMember
      summary: Add a Project member
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMembershipCreate"
      responses:
        "201":
          $ref: "#/components/responses/ProjectMembershipChanged"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateProjectMember
      summary: Change a Project member role
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMembershipPatch"
      responses:
        "200":
          $ref: "#/components/responses/ProjectMembershipChanged"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeProjectMember
      summary: Remove a Project member
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/ProjectMembershipMutation"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/milestones:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
    post:
      operationId: createMilestone
      summary: Create a milestone
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneCreate"
      responses:
        "201":
          $ref: "#/components/responses/MilestoneCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/milestones/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
      - $ref: "#/components/parameters/ResourceID"
    patch:
      operationId: updateMilestone
      summary: Update a milestone
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/ProjectIfMatch"
