openapi: 3.1.1
info:
  title: Bounty Board Work API
  version: 1.0.0
  description: Versioned work-management API for authenticated people and agents.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /api/v1/me:
    get:
      operationId: getCurrentPrincipal
      summary: Get the authenticated principal
      responses:
        "200":
          $ref: "#/components/responses/CurrentPrincipal"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List users available for work assignment
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/UserList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: List tasks
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TaskStatus"
        - name: priority
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TaskPriority"
        - name: assignee
          in: query
          description: User UUID or `none`.
          schema:
            type: string
        - name: label
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: project_number
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: archived
          in: query
          schema:
            type: string
            enum: [exclude, only, all]
            default: exclude
        - name: sort
          in: query
          schema:
            type: string
            enum: [number, updated_at, due_date, priority]
            default: updated_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          $ref: "#/components/responses/TaskList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTask
      summary: Create a task
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          $ref: "#/components/responses/TaskCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: getTask
      summary: Get a task
      responses:
        "200":
          $ref: "#/components/responses/Task"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateTask
      summary: Update a task
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          $ref: "#/components/responses/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/archive:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    post:
      operationId: archiveTask
      summary: Archive a task
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/restore:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    post:
      operationId: restoreTask
      summary: Restore a task
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/comments:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: listTaskComments
      summary: List task comments
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/CommentList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTaskComment
      summary: Add a task comment
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentWrite"
      responses:
        "201":
          $ref: "#/components/responses/CommentCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/ResourceID"
    patch:
      operationId: updateTaskComment
      summary: Update a task comment
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentWrite"
      responses:
        "200":
          $ref: "#/components/responses/Comment"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTaskComment
      summary: Delete a task comment
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{number}/activity:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: listTaskActivity
      summary: List task activity
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/TaskActivityList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/labels:
    get:
      operationId: listLabels
      summary: List labels
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/LabelList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createLabel
      summary: Create a label
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelWrite"
      responses:
        "201":
          $ref: "#/components/responses/LabelCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/labels/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      operationId: updateLabel
      summary: Rename a label
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelWrite"
      responses:
        "200":
          $ref: "#/components/responses/Label"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteLabel
      summary: Delete a label
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: archived
          in: query
          schema:
            type: string
            enum: [exclude, all]
            default: exclude
      responses:
        "200":
          $ref: "#/components/responses/ProjectList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProject
      summary: Create a project
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          $ref: "#/components/responses/ProjectCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
    get:
      operationId: getProject
      summary: Get a project and its work aggregate
      responses:
        "200":
          $ref: "#/components/responses/ProjectDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateProject
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
      responses:
        "200":
          $ref: "#/components/responses/Project"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/activate:
    $ref: "#/components/pathItems/ProjectActivate"
  /api/v1/projects/{number}/pause:
    $ref: "#/components/pathItems/ProjectPause"
  /api/v1/projects/{number}/complete:
    $ref: "#/components/pathItems/ProjectComplete"
  /api/v1/projects/{number}/cancel:
    $ref: "#/components/pathItems/ProjectCancel"
  /api/v1/projects/{number}/reopen:
    $ref: "#/components/pathItems/ProjectReopen"
  /api/v1/projects/{number}/archive:
    $ref: "#/components/pathItems/ProjectArchive"
  /api/v1/projects/{number}/restore:
    $ref: "#/components/pathItems/ProjectRestore"
  /api/v1/projects/{number}/milestones:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
    post:
      operationId: createMilestone
      summary: Create a milestone
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneCreate"
      responses:
        "201":
          $ref: "#/components/responses/MilestoneCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/milestones/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
      - $ref: "#/components/parameters/ResourceID"
    patch:
      operationId: updateMilestone
      summary: Update a milestone
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/ProjectIfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestonePatch"
      responses:
        "200":
          $ref: "#/components/responses/Milestone"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/milestones/{id}/complete:
    $ref: "#/components/pathItems/MilestoneComplete"
  /api/v1/projects/{number}/milestones/{id}/cancel:
    $ref: "#/components/pathItems/MilestoneCancel"
  /api/v1/projects/{number}/milestones/{id}/reopen:
    $ref: "#/components/pathItems/MilestoneReopen"
  /api/v1/tasks/{number}/criteria:
    parameters:
      - $ref: "#/components/parameters/TaskNumber"
    get:
      operationId: listTaskCriteria
      summary: List task acceptance criteria
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/CriterionList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTaskCriterion
      summary: Create a task acceptance criterion
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriterionCreate"
      responses:
        "201":
          $ref: "#/components/responses/CriterionCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/criteria:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
    get:
      operationId: listProjectCriteria
      summary: List project acceptance criteria
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/CriterionList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProjectCriterion
      summary: Create a project acceptance criterion
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriterionCreate"
      responses:
        "201":
          $ref: "#/components/responses/CriterionCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{number}/milestones/{id}/criteria:
    parameters:
      - $ref: "#/components/parameters/ProjectNumber"
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: listMilestoneCriteria
      summary: List milestone acceptance criteria
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/CriterionList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createMilestoneCriterion
      summary: Create a milestone acceptance criterion
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/ProjectIfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriterionCreate"
      responses:
        "201":
          $ref: "#/components/responses/CriterionCreated"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/criteria/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      operationId: updateCriterion
      summary: Update an acceptance criterion
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriterionPatch"
      responses:
        "200":
          $ref: "#/components/responses/Criterion"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCriterion
      summary: Remove an acceptance criterion
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LifecycleRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/criteria/{id}/checks:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: createAcceptanceCheck
      summary: Record an immutable acceptance check
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptanceCheckCreate"
      responses:
        "201":
          $ref: "#/components/responses/AcceptanceCheckCreated"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: bb_session
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page.
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      description: Page size. Defaults to 50 and is capped at 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    TaskNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProjectNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: One quoted positive integer resource version, for example `"3"`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    ProjectIfMatch:
      name: X-Project-If-Match
      in: header
      required: true
      description: Current project Etag when an operation changes a milestone and its project.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required for bearer-authenticated mutations; optional for browser sessions.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]+$'
  headers:
    Etag:
      description: Quoted positive integer resource version.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    Location:
      description: Canonical URL of the created resource.
      schema:
        type: string
        format: uri-reference
    RequestID:
      description: Server-owned request correlation ID.
      schema:
        type: string
    IdempotencyReplayed:
      description: Present and true when a stored response was replayed.
      schema:
        type: boolean
    RateLimitLimit:
      description: Sustained per-token request limit per minute.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Requests currently available in the token bucket.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Seconds until the token bucket is full, or until one request is available.
      schema:
        type: integer
        minimum: 0
    RetryAfter:
      description: Seconds before a retry is recommended.
      schema:
        type: integer
        minimum: 1
  pathItems:
    ProjectActivate:
      parameters:
        - $ref: "#/components/parameters/ProjectNumber"
      post:
        operationId: activateProject
        summary: Activate a project
        parameters:
          - $ref: "#/components/parameters/IfMatch"
          - $ref: "#/components/parameters/IdempotencyKey"
        requestBody:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleRequest"
        responses:
          "200":
            $ref: "#/components/responses/Project"
          default:
            $ref: "#/components/responses/Problem"
    ProjectPause:
      parameters:
        - $ref: "#/components/parameters/ProjectNumber"
      post:
        operationId: pauseProject
        summary: Pause a project
        parameters:
          - $ref: "#/components/parameters/IfMatch"
          - $ref: "#/components/parameters/IdempotencyKey"
        requestBody:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleRequest"
        responses:
          "200":
            $ref: "#/components/responses/Project"
          default:
            $ref: "#/components/responses/Problem"
    ProjectComplete:
      parameters:
        - $ref: "#/components/parameters/ProjectNumber"
      post:
        operationId: completeProject
        summary: Complete a project
        parameters:
          - $ref: "#/components/parameters/IfMatch"
          - $ref: "#/components/parameters/IdempotencyKey"
        requestBody:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleRequest"
        responses:
          "200":
            $ref: "#/components/responses/Project"
          default:
            $ref: "#/components/responses/Problem"
    ProjectCancel:
      parameters:
        - $ref: "#/components/parameters/ProjectNumber"
      post:
        operationId: cancelProject
        summary: Cancel a project
        parameters:
          - $ref: "#/components/parameters/IfMatch"
          - $ref: "#/components/parameters/IdempotencyKey"
        requestBody:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleRequest"
        responses:
          "200":
            $ref: "#/components/responses/Project"
          default:
            $ref: "#/components/responses/Problem"
    ProjectReopen:
      parameters:
        - $ref: "#/components/parameters/ProjectNumber"
      post:
        operationId: reopenProject
        summary: Reopen a project
        parameters:
          - $ref: "#/components/parameters/IfMatch"
          - $ref: "#/components/parameters/IdempotencyKey"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleRequest"
        responses:
          "200":
            $ref: "#/components/responses/Project"
          default:
            $ref: "#/components/responses/Problem"
    ProjectArchive:
      parameters:
        - $ref: "#/components/parameters/ProjectNumber"
      post:
        operationId: archiveProject
        summary: Archive a project
        parameters:
          - $ref: "#/components/parameters/IfMatch"
          - $ref: "#/components/parameters/IdempotencyKey"
        responses:
          "200":
            $ref: "#/components/responses/Project"
          default:
            $ref: "#/components/responses/Problem"
    ProjectRestore:
      parameters:
        - $ref: "#/components/parameters/ProjectNumber"
      post:
        operationId: restoreProject
        summary: Restore a project
        parameters:
          - $ref: "#/components/parameters/IfMatch"
          - $ref: "#/components/parameters/IdempotencyKey"
        responses:
          "200":
            $ref: "#/components/responses/Project"
          default:
            $ref: "#/components/responses/Problem"
    MilestoneComplete:
      parameters:
        - $ref: "#/components/parameters/ProjectNumber"
        - $ref: "#/components/parameters/ResourceID"
      post:
        operationId: completeMilestone
        summary: Complete a milestone
        parameters:
          - $ref: "#/components/parameters/IfMatch"
          - $ref: "#/components/parameters/ProjectIfMatch"
          - $ref: "#/components/parameters/IdempotencyKey"
        requestBody:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleRequest"
        responses:
          "200":
            $ref: "#/components/responses/Milestone"
          default:
            $ref: "#/components/responses/Problem"
    MilestoneCancel:
      parameters:
        - $ref: "#/components/parameters/ProjectNumber"
        - $ref: "#/components/parameters/ResourceID"
      post:
        operationId: cancelMilestone
        summary: Cancel a milestone
        parameters:
          - $ref: "#/components/parameters/IfMatch"
          - $ref: "#/components/parameters/ProjectIfMatch"
          - $ref: "#/components/parameters/IdempotencyKey"
        requestBody:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleRequest"
        responses:
          "200":
            $ref: "#/components/responses/Milestone"
          default:
            $ref: "#/components/responses/Problem"
    MilestoneReopen:
      parameters:
        - $ref: "#/components/parameters/ProjectNumber"
        - $ref: "#/components/parameters/ResourceID"
      post:
        operationId: reopenMilestone
        summary: Reopen a milestone
        parameters:
          - $ref: "#/components/parameters/IfMatch"
          - $ref: "#/components/parameters/ProjectIfMatch"
          - $ref: "#/components/parameters/IdempotencyKey"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleRequest"
