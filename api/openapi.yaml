components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: bb_session
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page.
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      description: Page size. Defaults to 50 and is capped at 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    TaskNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProjectNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClientKind:
      name: client_kind
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    ClientSessionID:
      name: client_session_id
      in: query
      required: true
      description: Opaque stable ID of the current Codex task, such as CODEX_THREAD_ID.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ClaimCriterionID:
      name: criterion_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: One quoted positive integer resource version, for example `"3"`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    ProjectIfMatch:
      name: X-Project-If-Match
      in: header
      required: true
      description: Current project Etag when an operation changes a milestone and its project.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required for bearer-authenticated mutations; optional for browser sessions.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]+$'
  headers:
    Etag:
      description: Quoted positive integer resource version.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    Location:
      description: Canonical URL of the created resource.
      schema:
        type: string
        format: uri-reference
    RequestID:
      description: Server-owned request correlation ID.
      schema:
        type: string
    IdempotencyReplayed:
      description: Present and true when a stored response was replayed.
      schema:
        type: boolean
    RateLimitLimit:
      description: Sustained per-token request limit per minute.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Requests currently available in the token bucket.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Seconds until the token bucket is full, or until one request is available.
      schema:
        type: integer
        minimum: 0
    RetryAfter:
      description: Seconds before a retry is recommended.
      schema:
        type: integer
        minimum: 1
  pathItems:
    ProjectArchive:
      parameters:
        - $ref: "#/components/parameters/ProjectNumber"
      post:
        operationId: archiveProject
        summary: Archive a project
        parameters:
          - $ref: "#/components/parameters/IfMatch"
          - $ref: "#/components/parameters/IdempotencyKey"
        responses:
          "200":
            $ref: "#/components/responses/Project"
          default:
            $ref: "#/components/responses/Problem"
    ProjectRestore:
