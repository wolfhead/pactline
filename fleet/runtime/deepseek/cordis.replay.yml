# Keyless contract profile: retain the production plugin tree, replace only
# the provider adapter with DSH's deterministic session-log replay adapter.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek Replay
                  models:
                    - id: deepseek-v4-pro
