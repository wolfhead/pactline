name: Feature request
description: Propose a product outcome or domain change.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the need and outcome before prescribing an implementation.
        Do not include private company or personal information.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and in what workflow?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What should be observably better?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and acceptance
      description: Relevant invariants, integrations, or checks.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
