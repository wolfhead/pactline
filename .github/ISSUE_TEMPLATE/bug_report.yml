name: Bug report
description: Report reproducible incorrect behavior using synthetic data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, real identities, company information,
        production data, invitation links, or internal infrastructure.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic data.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or branch name.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Additional evidence
      description: Sanitized logs, screenshots, or tests, if available.
