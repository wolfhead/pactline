name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pactline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pactline_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports:
          - 5673:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pactline_test?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@localhost:5673/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true
      - name: Verify generated OpenAPI transport
        run: make openapi-check
      - name: Run Go tests
        run: go test ./... -count=1 -p 1

  frontend:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run component tests
        run: npm test
      - name: Build
        run: npm run build
