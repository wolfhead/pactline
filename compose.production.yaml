name: pactline

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pactline}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-pactline}
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - data

  api:
    image: ${PACTLINE_API_IMAGE:-ghcr.io/wolfhead/pactline-api}:${PACTLINE_VERSION:?PACTLINE_VERSION is required}
    environment:
      ADDR: :8080
      APP_ENV: production
      AUTH_PROVIDER: lark
      APP_BASE_URL: ${PACTLINE_APP_BASE_URL:?PACTLINE_APP_BASE_URL is required}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required}
      DATABASE_URL_FILE: /run/secrets/database_url
      LARK_APP_ID: ${LARK_APP_ID:?LARK_APP_ID is required}
      LARK_APP_SECRET_FILE: /run/secrets/lark_app_secret
      LARK_REDIRECT_URI: ${LARK_REDIRECT_URI:?LARK_REDIRECT_URI is required}
      LARK_TENANT_KEY: ${LARK_TENANT_KEY:?LARK_TENANT_KEY is required}
      LOG_LEVEL: ${PACTLINE_LOG_LEVEL:-info}
      OAUTH_TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/oauth_token_encryption_key
      OAUTH_TOKEN_ENCRYPTION_KEY_ID: ${OAUTH_TOKEN_ENCRYPTION_KEY_ID:-primary}
      SESSION_SECRET_FILE: /run/secrets/session_secret
    secrets:
      - database_url
      - lark_app_secret
      - oauth_token_encryption_key
      - session_secret
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - app
      - data

  web:
    image: ${PACTLINE_WEB_IMAGE:-ghcr.io/wolfhead/pactline-web}:${PACTLINE_VERSION:?PACTLINE_VERSION is required}
    ports:
      - "${PACTLINE_BIND_ADDRESS:-127.0.0.1}:${PACTLINE_HTTP_PORT:-18080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config:uid=10001,gid=10001,mode=0700
      - /data:uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - app

secrets:
  database_url:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/database_url
  lark_app_secret:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/lark_app_secret
  oauth_token_encryption_key:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/oauth_token_encryption_key
  postgres_password:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/postgres_password
  session_secret:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/session_secret

volumes:
  postgres_data:

networks:
  app:
  data:
    internal: true
