name: pactline

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pactline}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-pactline}
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - data

  rabbitmq:
    image: rabbitmq:4.1-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pactline}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/rabbitmq_password)"
        exec /usr/local/bin/docker-entrypoint.sh rabbitmq-server
    secrets:
      - rabbitmq_password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - data

  api:
    image: ${PACTLINE_API_IMAGE:-ghcr.io/wolfhead/pactline-api}:${PACTLINE_VERSION:?PACTLINE_VERSION is required}
    environment:
      ADDR: :8080
      APP_ENV: production
      AUTH_PROVIDER: lark
      APP_BASE_URL: ${PACTLINE_APP_BASE_URL:?PACTLINE_APP_BASE_URL is required}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required}
      DATABASE_URL_FILE: /run/secrets/database_url
      LARK_APP_ID: ${LARK_APP_ID:?LARK_APP_ID is required}
      LARK_APP_SECRET_FILE: /run/secrets/lark_app_secret
      LARK_REDIRECT_URI: ${LARK_REDIRECT_URI:?LARK_REDIRECT_URI is required}
      LOG_LEVEL: ${PACTLINE_LOG_LEVEL:-info}
      OAUTH_TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/oauth_token_encryption_key
      OAUTH_TOKEN_ENCRYPTION_KEY_ID: ${OAUTH_TOKEN_ENCRYPTION_KEY_ID:-primary}
      SESSION_SECRET_FILE: /run/secrets/session_secret
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      ATTACHMENT_STORAGE_PROVIDER: ${ATTACHMENT_STORAGE_PROVIDER:-local}
      ATTACHMENT_LOCAL_ROOT: /var/lib/pactline/attachments
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      AGENT_DELEGATION_SIGNING_KEY_FILE: /run/secrets/agent_delegation_signing_key
      AGENT_DELEGATION_SIGNING_KEY_ID: ${AGENT_DELEGATION_SIGNING_KEY_ID:-agent-delegate-primary}
      AGENT_CHECKPOINT_ENCRYPTION_KEY_FILE: /run/secrets/agent_checkpoint_encryption_key
      AGENT_CHECKPOINT_ENCRYPTION_KEY_ID: ${AGENT_CHECKPOINT_ENCRYPTION_KEY_ID:-agent-checkpoint-primary}
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-1}
      AGENT_TENANT_TIMEZONE: ${AGENT_TENANT_TIMEZONE:-Asia/Shanghai}
    secrets:
      - database_url
      - lark_app_secret
      - oauth_token_encryption_key
      - session_secret
      - deepseek_api_key
      - agent_delegation_signing_key
      - agent_checkpoint_encryption_key
      - rabbitmq_url
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - attachment_data:/var/lib/pactline/attachments
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - app
      - data

  web:
    image: ${PACTLINE_WEB_IMAGE:-ghcr.io/wolfhead/pactline-web}:${PACTLINE_VERSION:?PACTLINE_VERSION is required}
    ports:
      - "${PACTLINE_BIND_ADDRESS:-127.0.0.1}:${PACTLINE_HTTP_PORT:-18080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config:uid=10001,gid=10001,mode=0700
      - /data:uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - app

secrets:
  database_url:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/database_url
  lark_app_secret:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/lark_app_secret
  oauth_token_encryption_key:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/oauth_token_encryption_key
  postgres_password:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/postgres_password
  session_secret:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/session_secret
  deepseek_api_key:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/deepseek_api_key
  agent_delegation_signing_key:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/agent_delegation_signing_key
  agent_checkpoint_encryption_key:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/agent_checkpoint_encryption_key
  rabbitmq_password:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/rabbitmq_password
  rabbitmq_url:
    file: ${PACTLINE_SECRETS_DIR:-./deploy/secrets}/rabbitmq_url

volumes:
  postgres_data:
  rabbitmq_data:
  attachment_data:

networks:
  app:
  data:
    internal: true
